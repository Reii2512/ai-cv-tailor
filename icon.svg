      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  
  <!-- Background Kotak Melengkung Premium -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  
  <!-- Dokumen CV / Kertas Putih (Digeser ke atas sedikit) -->
  <g transform="translate(148, 65) scale(0.85)">
