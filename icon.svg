    <!-- Garis Header Dokumen -->
    <rect x="40" y="44" width="120" height="16" rx="8" fill="#0f172a"/>
    <rect x="40" y="72" width="80" height="10" rx="5" fill="#64748b"/>
    <!-- Garis-garis teks isi ATS -->
    <rect x="40" y="112" width="160" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="40" y="136" width="140" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="40" y="160" width="120" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="40" y="200" width="160" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="40" y="224" width="100" height="8" rx="4" fill="#cbd5e1"/>
  </g>

  <!-- Badge AI Sparkle / Aksen Bintang di Pojok Kanan Atas -->
  <g transform="translate(325, 55) scale(0.85)">
